name: Build iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Set API URL
        working-directory: frontend
        run: echo "REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL }}" > .env

      - name: Build React app
        working-directory: frontend
        run: CI=false npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        working-directory: frontend
        run: npx cap update ios

      - name: Build iOS archive
        working-directory: frontend/ios
        run: |
          xcodebuild \
            -project App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO

      - name: Export IPA
        working-directory: frontend/ios
        run: |
          mkdir -p build/Payload
          mkdir -p build/IPA
          cp -R build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r IPA/Tamil-Nadu-Property-Price-Predictor.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: tamil-nadu-property-predictor-ios
          path: frontend/ios/build/IPA/Tamil-Nadu-Property-Price-Predictor.ipa
