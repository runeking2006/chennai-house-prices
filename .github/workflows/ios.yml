name: Preview iOS

on:
  workflow_dispatch:

jobs:
  preview:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Set API URL
        working-directory: frontend
        run: echo "REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL }}" > .env

      - name: Build React
        working-directory: frontend
        run: CI=false npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync ios

      - name: Build Simulator
        working-directory: frontend/ios
        run: |
          xcodebuild \
            -project App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            build

      - name: Boot Simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b

      - name: Install App
        working-directory: frontend/ios
        run: |
          DEVICE=$(xcrun simctl list devices booted | grep -m 1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/App.app

      - name: Screenshot
        run: |
          DEVICE=$(xcrun simctl list devices booted | grep -m 1 "iPhone" | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          xcrun simctl io "$DEVICE" screenshot ios-preview.png

      - name: Upload Screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ios-preview
          path: ios-preview.png
