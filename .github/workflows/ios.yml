name: Build iOS Simulator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Set API URL
        working-directory: frontend
        run: echo "REACT_APP_API_BASE_URL=${{ vars.REACT_APP_API_BASE_URL }}" > .env

      - name: Build React app
        working-directory: frontend
        run: CI=false npm run build

      - name: Sync Capacitor
        working-directory: frontend
        run: npx cap sync ios

      - name: Build iOS Simulator app
        working-directory: frontend/ios
        run: |
          xcodebuild \
            -project App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/simulator \
            build

      - name: Upload Simulator App
        uses: actions/upload-artifact@v4
        with:
          name: tamil-nadu-property-predictor-ios-simulator
          path: frontend/ios/build/simulator/Build/Products/Debug-iphonesimulator/App.app
